    <rect x="1346" y="404" width="360" height="236" rx="18" fill="#000" opacity=".55" filter="url(#soft-shadow)"/>
    <rect x="1372" y="384" width="340" height="216" rx="18" fill="#141a30" stroke="#2a3456" opacity=".7"/>
    <rect x="1350" y="400" width="350" height="226" rx="18" fill="url(#thumb)" stroke="#36446e"/>
    <rect x="1372" y="422" width="306" height="128" rx="10" fill="#0b1020" stroke="#26314d"/>
    <g fill="#3a4766">
      <rect x="1392" y="446" width="60" height="10" rx="5"/>
      <rect x="1468" y="446" width="120" height="10" rx="5"/>
      <rect x="1392" y="474" width="60" height="10" rx="5"/>
      <rect x="1392" y="502" width="60" height="10" rx="5"/>
      <rect x="1392" y="528" width="60" height="10" rx="5"/>
      <rect x="1468" y="528" width="96" height="10" rx="5"/>
    </g>
    <rect x="1468" y="470" width="150" height="18" rx="4" fill="#05070d"/>
    <rect x="1468" y="498" width="124" height="18" rx="4" fill="#05070d"/>
    <path d="M1640 470c-4 34-20 52-70 60" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
    <rect x="1372" y="568" width="140" height="40" rx="20" fill="#f5f5f7"/>
    <text x="1442" y="594" text-anchor="middle" fill="#1c1c1e" font-size="17" font-weight="600">Copiar</text>
    <rect x="1526" y="568" width="152" height="40" rx="20" fill="#f5f5f7"/>
    <text x="1602" y="594" text-anchor="middle" fill="#1c1c1e" font-size="17" font-weight="600">Guardar</text>
    <text x="1525" y="672" text-anchor="middle" fill="#7d89a8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing=".12em">EN EL PORTAPAPELES</text>
    <circle cx="1418" cy="667" r="4" fill="#14b8e6" filter="url(#glow)"/>
    <circle cx="1418" cy="667" r="3" fill="#14b8e6"/>
  </g>

  <!-- Quiet technical texture; the HTML title occupies the lower-left. -->
  <g fill="#5b9bff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing=".09em" opacity=".1">
    <text x="1240" y="776">OCR / EN TU EQUIPO</text>
    <text x="1240" y="806">TAPAR / IBAN DNI CORREO</text>
    <text x="1240" y="836">TELEMETRÍA / NINGUNA</text>
    <text x="1570" y="776">EXE / 2.2 MB</text>
    <text x="1570" y="806">VÍDEO / 60 FPS</text>
    <text x="1570" y="836">LICENCIA / MIT</text>
  </g>
</svg>
